# Roda a suíte de testes de segurança a cada push no repositório.
# Se qualquer teste falhar, o pytest termina com código de erro e o workflow fica
# vermelho (falha) na aba Actions do GitHub.

name: Testes de segurança

on:
  push:

jobs:
  testes:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi/requirements.txt

      - name: Executar os testes
        run: pytest tests/ -v
